<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM API 价格对比 — 国内外主流大模型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='12' width='4' height='9' rx='1' fill='%230F62FE'/%3E%3Crect x='10' y='7' width='4' height='14' rx='1' fill='%23D97757'/%3E%3Crect x='17' y='3' width='4' height='18' rx='1' fill='%235786FE'/%3E%3C/svg%3E">
<meta name="description" content="国内外主流大模型 API 价格对比:OpenAI、Anthropic、Google、xAI、Mistral、DeepSeek、阿里、智谱、Kimi、豆包、混元、MiniMax,支持成本估算与币种切换。">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e4e7ec; --border-soft: #eef0f3;
    --text: #16181d; --muted: #6b7280; --accent: #0f62fe; --accent-bg: #eaf1ff;
    --cn: #c2410c; --intl: #1d4ed8; --good: #047857;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316; --panel: #1b1b1f; --border: #2c2c33; --border-soft: #232329;
      --text: #e8e9ec; --muted: #9a9aa3; --accent: #6b9bff; --accent-bg: #1e2a45;
      --cn: #fb923c; --intl: #7aa5f8; --good: #34d399;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .logo-inv { filter: invert(1); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta b { color: var(--text); font-weight: 600; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }

  /* 工具栏 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; margin: 16px 0 10px; }
  .toolbar input[type="search"] { flex: 1 1 200px; min-width: 160px; }
  input, select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }

  /* 厂商 chips: 过滤器 + 图例 */
  .vendors { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .vchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border: 1px solid var(--border); border-radius: 999px; background: transparent; cursor: pointer; font-size: 12.5px; color: var(--muted); transition: background .12s, border-color .12s, color .12s; }
  .vchip:hover { border-color: var(--vc); color: var(--text); }
  .vchip.on { background: color-mix(in srgb, var(--vc) 12%, transparent); border-color: var(--vc); color: var(--text); font-weight: 600; }
  .vchip .cnt { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .vlogo { width: 20px; height: 20px; border-radius: 50%; background: color-mix(in srgb, var(--vc) 10%, #fff); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  @media (prefers-color-scheme: dark) { .vlogo { background: color-mix(in srgb, var(--vc) 18%, #000); } }
  .vlogo img { width: 13px; height: 13px; object-fit: contain; }
  .vlogo .letter { font-size: 11px; font-weight: 700; color: var(--vc); }

  /* 计算器 */
  .calc { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .calc label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .calc input { width: 110px; font-family: var(--mono); }
  .calc .hint { color: var(--muted); font-size: 12px; }

  /* 表格 */
  .table-box { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--panel); text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--accent); }
  thead th .arrow { font-size: 10px; }
  th.num, td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: color-mix(in srgb, var(--vc, #888) 6%, transparent); }
  tbody tr.row.open { background: color-mix(in srgb, var(--vc, #888) 9%, transparent); }
  .vendor { font-weight: 600; }
  .vcell { display: inline-flex; align-items: center; gap: 8px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; margin-left: 2px; vertical-align: 1px; }
  .badge.cn { color: var(--cn); border: 1px solid currentColor; }
  .badge.intl { color: var(--intl); border: 1px solid currentColor; }
  .model-name { font-family: var(--mono); font-size: 12.5px; }
  td.detail { white-space: normal; background: var(--bg); font-size: 12.5px; color: var(--muted); padding: 10px 14px; }
  td.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
  td.detail dt { color: var(--muted); }
  td.detail dd { color: var(--text); font-family: var(--mono); }
  td.detail a { color: var(--accent); }
  .cost { color: var(--good); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  footer { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>LLM API 价格对比</h1>
    <span class="meta" id="meta">加载中…</span>
  </header>

  <div class="panel vendors" id="vendorBar"></div>

  <div class="panel toolbar">
    <input type="search" id="q" placeholder="搜索模型 / 厂商…">
    <div class="seg" id="regionSeg">
      <button data-v="all" class="on">全部</button>
      <button data-v="cn">国内</button>
      <button data-v="intl">国外</button>
    </div>
    <div class="seg" id="curSeg">
      <button data-v="USD">USD $</button>
      <button data-v="CNY" class="on">CNY ¥</button>
    </div>
  </div>

  <div class="panel calc">
    <strong>成本计算器</strong>
    <label>每月输入 <input type="number" id="calcIn" min="0" step="any" placeholder="0"> 百万 token</label>
    <label>每月输出 <input type="number" id="calcOut" min="0" step="any" placeholder="0"> 百万 token</label>
    <span class="hint">填入用量后表格出现「月成本」列,点击表头可按成本排序</span>
  </div>

  <div class="panel table-box">
    <table id="tbl">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>没有匹配的模型</div>
  </div>

  <footer>
    <p>价格单位:每 100 万 token。国际厂商数据来自 LiteLLM / OpenRouter 公开价格库,国内厂商数据为人工整理自官方定价页,每行附来源链接。价格可能滞后或存在阶梯价、缓存价、限时优惠等情况,<b>实际计费请以各厂商官网为准</b>。Logo 版权归各厂商所有,仅作识别用途。</p>
    <p>数据来源:<a href="https://github.com/BerriAI/litellm" target="_blank" rel="noopener">LiteLLM</a> · <a href="https://openrouter.ai" target="_blank" rel="noopener">OpenRouter</a> · 各厂商官方定价页</p>
  </footer>
</div>

<script>
"use strict";

// 厂商视觉档案: logo + 品牌色; invert = 黑色 logo,深色模式下反白
const VENDOR_META = {
  "OpenAI":    { logo: "assets/logos/openai.svg",    color: "#10A37F", invert: true },
  "Anthropic": { logo: "assets/logos/anthropic.svg", color: "#D97757" },
  "Google":    { logo: "assets/logos/google.svg",    color: "#8E75B2" },
  "xAI":       { logo: "assets/logos/xai.ico",       color: "#52525B", invert: true },
  "Mistral":   { logo: "assets/logos/mistral.svg",   color: "#FA520F" },
  "DeepSeek":  { logo: "assets/logos/deepseek.svg",  color: "#5786FE" },
  "智谱":      { logo: "assets/logos/zhipu.ico",     color: "#3858E9" },
  "阿里百炼":  { logo: "assets/logos/aliyun.ico",    color: "#FF6A00" },
  "Kimi":      { logo: "assets/logos/kimi.ico",      color: "#52525B", invert: true },
  "豆包":      { logo: "assets/logos/doubao.ico",    color: "#F53F3F" },
  "腾讯混元":  { logo: "assets/logos/hunyuan.ico",   color: "#0052D9" },
  "MiniMax":   { logo: "assets/logos/minimax.ico",   color: "#2448F3" },
};
const FALLBACK_COLORS = ["#0F62FE","#9333EA","#DB2777","#EA580C","#059669","#0284C7"];
let fallbackIdx = 0;
function vendorMeta(name) {
  if (!VENDOR_META[name]) {
    VENDOR_META[name] = { logo: null, color: FALLBACK_COLORS[fallbackIdx++ % FALLBACK_COLORS.length] };
  }
  return VENDOR_META[name];
}
function vlogoHtml(name, size) {
  const m = vendorMeta(name);
  const inner = m.logo
    ? `<img src="${m.logo}" alt="" loading="lazy"${m.invert ? ' class="logo-inv"' : ""} onerror="this.parentNode.innerHTML='<span class=letter>${name[0]}</span>'">`
    : `<span class="letter">${name[0]}</span>`;
  return `<span class="vlogo" style="--vc:${m.color}">${inner}</span>`;
}

const state = {
  data: null, currency: "CNY", region: "all", vendor: "", q: "",
  sortKey: "inputUSD", sortDir: 1, openRow: null,
  calcIn: 0, calcOut: 0,
};

const $ = (s) => document.querySelector(s);
const fmtNum = (v) => v == null ? "—" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
const fmtCtx = (c) => c == null ? "—" : c >= 1e6 ? (Math.round(c / 1e4) / 100) + "M" : Math.round(c / 1e3) + "k";

function price(usd) {
  if (usd == null) return null;
  return state.currency === "USD" ? usd : usd * state.data.fx.USD_CNY;
}
const sym = () => state.currency === "USD" ? "$" : "¥";

function visibleModels() {
  const q = state.q.trim().toLowerCase();
  let list = state.data.models.filter((m) => {
    if (state.region !== "all" && m.region !== state.region) return false;
    if (state.vendor && m.vendor !== state.vendor) return false;
    if (q && !(m.model.toLowerCase().includes(q) || m.vendor.toLowerCase().includes(q) || m.modelId.toLowerCase().includes(q))) return false;
    return true;
  });
  const costOn = state.calcIn > 0 || state.calcOut > 0;
  const key = state.sortKey;
  list.sort((a, b) => {
    let va, vb;
    if (key === "cost" && costOn) { va = a.inputUSD * state.calcIn + a.outputUSD * state.calcOut; vb = b.inputUSD * state.calcIn + b.outputUSD * state.calcOut; }
    else if (key === "vendor") { return a.vendor.localeCompare(b.vendor, "zh-Hans-CN") * state.sortDir || (a.inputUSD - b.inputUSD) * state.sortDir; }
    else if (key === "context") { va = a.context ?? -1; vb = b.context ?? -1; }
    else { va = a[key]; vb = b[key]; }
    return (va - vb) * state.sortDir;
  });
  return list;
}

function renderHead(costOn) {
  const cols = [
    ["vendor", "厂商"], ["model", "模型", 0], ["inputUSD", `输入价 ${sym()}`, 1],
    ["outputUSD", `输出价 ${sym()}`, 1], ["context", "上下文", 1],
  ];
  if (costOn) cols.push(["cost", `月成本 ${sym()}`, 1]);
  $("#headRow").innerHTML = cols.map(([k, label, num]) => {
    const arrow = state.sortKey === k ? `<span class="arrow">${state.sortDir > 0 ? "▲" : "▼"}</span>` : "";
    const cls = num ? ' class="num"' : "";
    return k === "model" ? `<th${cls}>${label}</th>` : `<th${cls} data-sort="${k}">${label} ${arrow}</th>`;
  }).join("");
  $("#headRow").querySelectorAll("[data-sort]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.sort;
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
    state.openRow = null;
    render();
  }));
}

function renderVendorBar() {
  const counts = {};
  for (const m of state.data.models) counts[m.vendor] = (counts[m.vendor] || 0) + 1;
  const vendors = Object.keys(counts).sort((a, b) => a.localeCompare(b, "zh-Hans-CN"));
  $("#vendorBar").innerHTML = vendors.map((v) => {
    const m = vendorMeta(v);
    return `<button class="vchip${state.vendor === v ? " on" : ""}" data-v="${v}" style="--vc:${m.color}">${vlogoHtml(v)}${v}<span class="cnt">${counts[v]}</span></button>`;
  }).join("");
  $("#vendorBar").querySelectorAll(".vchip").forEach((chip) => chip.addEventListener("click", () => {
    state.vendor = state.vendor === chip.dataset.v ? "" : chip.dataset.v;
    state.openRow = null;
    renderVendorBar();
    render();
  }));
}

function detailRow(m) {
  const rows = [
    ["API model id", m.modelId],
    ["原始标价", `${m.currency === "USD" ? "$" : "¥"}${fmtNum(m.input)} / ${fmtNum(m.output)} (${m.currency})`],
    ["数据来源", { litellm: "LiteLLM 价格库", openrouter: "OpenRouter", manual: "官方定价页(人工整理)" }[m.source] || m.source],
    ["官方定价页", m.sourceUrl ? `<a href="${m.sourceUrl}" target="_blank" rel="noopener">${m.sourceUrl}</a>` : "—"],
  ];
  if (m.observedAt) rows.push(["人工核对日期", m.observedAt]);
  if (m.notes) rows.push(["备注", m.notes]);
  return `<tr class="detail"><td colspan="10" class="detail"><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></td></tr>`;
}

function render() {
  const costOn = state.calcIn > 0 || state.calcOut > 0;
  renderHead(costOn);
  const list = visibleModels();
  $("#empty").hidden = list.length > 0;
  const html = [];
  list.forEach((m) => {
    const key = m.vendor + "|" + m.modelId;
    const vm = vendorMeta(m.vendor);
    const badge = m.region === "cn" ? '<span class="badge cn">国内</span>' : '<span class="badge intl">国外</span>';
    const cost = costOn ? `<td class="num cost">${fmtNum(price(m.inputUSD * state.calcIn + m.outputUSD * state.calcOut))}</td>` : "";
    const free = m.inputUSD === 0 && m.outputUSD === 0;
    html.push(`<tr class="row${state.openRow === key ? " open" : ""}" data-key="${key}" style="--vc:${vm.color}">
      <td class="vendor"><span class="vcell">${vlogoHtml(m.vendor)}${m.vendor}${badge}</span></td>
      <td class="model-name">${m.model}</td>
      <td class="num">${free ? "免费" : fmtNum(price(m.inputUSD))}</td>
      <td class="num">${free ? "免费" : fmtNum(price(m.outputUSD))}</td>
      <td class="num">${fmtCtx(m.context)}</td>${cost}
    </tr>`);
    if (state.openRow === key) html.push(detailRow(m));
  });
  $("#bodyRows").innerHTML = html.join("");
  $("#bodyRows").querySelectorAll("tr.row").forEach((tr) => tr.addEventListener("click", () => {
    state.openRow = state.openRow === tr.dataset.key ? null : tr.dataset.key;
    render();
  }));
}

async function init() {
  const res = await fetch("prices.json", { cache: "no-cache" });
  state.data = await res.json();

  const d = new Date(state.data.updatedAt);
  $("#meta").innerHTML = `共 <b>${state.data.count}</b> 个模型 · 数据更新于 <b>${d.toLocaleString("zh-CN")}</b> · 汇率 1 USD = <b>${state.data.fx.USD_CNY.toFixed(2)}</b> CNY`;

  $("#q").addEventListener("input", (e) => { state.q = e.target.value; state.openRow = null; render(); });
  $("#regionSeg").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    state.region = e.target.dataset.v; state.openRow = null;
    $("#regionSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target));
    render();
  });
  $("#curSeg").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    state.currency = e.target.dataset.v;
    $("#curSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target));
    render();
  });
  const onCalc = () => {
    state.calcIn = parseFloat($("#calcIn").value) || 0;
    state.calcOut = parseFloat($("#calcOut").value) || 0;
    if ((state.calcIn > 0 || state.calcOut > 0) && state.sortKey !== "cost") { state.sortKey = "cost"; state.sortDir = 1; }
    state.openRow = null;
    render();
  };
  $("#calcIn").addEventListener("input", onCalc);
  $("#calcOut").addEventListener("input", onCalc);

  renderVendorBar();
  render();
}

init().catch((err) => { $("#meta").textContent = "加载 prices.json 失败: " + err.message; });
</script>
</body>
</html>
