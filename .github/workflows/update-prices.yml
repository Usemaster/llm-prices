name: 每日更新价格数据

on:
  schedule:
    # 每天 UTC 01:17(北京时间 09:17)跑构建
    - cron: "17 1 * * *"
  workflow_dispatch: # 允许手动触发
  push:
    branches: [main] # 代码/数据变更时触发部署

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建 prices.json
        run: node scripts/build-data.mjs

      - name: 提交变更
        run: |
          if git diff --quiet prices.json; then
            echo "价格数据无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "chore(data): 更新价格数据 $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        run: npx --yes wrangler@4 pages deploy . --project-name=llm-prices --branch=main --commit-hash=${{ github.sha }}

      - name: 未配置 secrets,跳过部署
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::缺少 CF_API_TOKEN / CF_ACCOUNT_ID secrets,跳过 Pages 部署"
